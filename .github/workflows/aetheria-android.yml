name: Aetheria - Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive_parts/**'
      - '.github/workflows/aetheria-android.yml'

permissions:
  contents: write

jobs:
  compilar-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Recuperar projeto 3D original
        shell: bash
        run: |
          set -euo pipefail
          test -f archive_parts/part_19.b64 || { echo "::error::Partes do projeto não encontradas"; exit 1; }
          cat archive_parts/part_*.b64 | base64 -d > /tmp/Aetheria_Proto03.zip
          echo 'ee5ab25028cdf8838e0f364f551cfdb7764bd0abec9923a913551b3d93cda748  /tmp/Aetheria_Proto03.zip' | sha256sum -c -
          mkdir -p game
          unzip -q /tmp/Aetheria_Proto03.zip -d game
          test -f game/Aetheria_Noctis_Godot4_Proto03_Com_Musica/project.godot
          test -f game/Aetheria_Noctis_Godot4_Proto03_Com_Musica/assets/characters/Noctis_Base_3D.glb
          test -f game/Aetheria_Noctis_Godot4_Proto03_Com_Musica/assets/audio/Aetheria_Tema_de_Abertura.ogg

      - name: Preparar Godot e chave Android de testes
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          # GitHub Actions altera HOME para /github/home; copiar configuracoes
          # do container de build, criadas originalmente em /root.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$HOME/.config/godot"
          test -s /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp -a /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/editor_settings-4.4.tres"
          grep -q 'java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar cenas e recursos 3D
        shell: bash
        run: |
          set -euo pipefail
          cd game/Aetheria_Noctis_Godot4_Proto03_Com_Musica
          # Godot em Linux headless precisa importar ETC2/ASTC para o Android.
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          godot --headless --editor --path . --import

      - name: Compilar APK de teste
        shell: bash
        run: |
          set -euo pipefail
          cd game/Aetheria_Noctis_Godot4_Proto03_Com_Musica
          mkdir -p builds
          godot --headless --path . --export-debug Android builds/Aetheria-Noctis-Android.apk
          test -s builds/Aetheria-Noctis-Android.apk
          cp builds/Aetheria-Noctis-Android.apk "$GITHUB_WORKSPACE/Aetheria-Noctis-Android.apk"

      - name: Arquivar APK da compilação
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-APK-TESTE
          path: Aetheria-Noctis-Android.apk
          if-no-files-found: error

      - name: Publicar versão Android para download HTTPS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetheria-proto03-android
          name: Aetheria - APK do protótipo de Nóctis 03
          prerelease: true
          make_latest: false
          files: Aetheria-Noctis-Android.apk
          body: |
            Este APK é um protótipo 3D de testes, não a versão cinematográfica final de Aetheria.
            Contém os modelos e áudio do projeto enviado anteriormente. Instale apenas para testar.
